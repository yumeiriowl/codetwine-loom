[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codetwine-loom"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "codetwine @ git+https://github.com/yumeiriowl/codetwine.git",
    "litellm>=1.101.0",
    # The OpenAI SDK whose clients providercall.py sets to follow no redirect (httpx2)
    "openai>=3",
    # Reads the .env file config.py looks for
    "python-dotenv",
    # The static check the stages that change Python code run (CHECK_COMMAND)
    "ruff",
]

# Development dependencies
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codetwine-loom = "codetwine_loom.__main__:main"

# Needed to write codetwine as a "@ git+https://..." direct reference. Without it
# hatchling fails its metadata validation with "direct references are not allowed"
# and pip install -e . does not work
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["codetwine_loom"]
